<!doctype html>
<!-- Bedrock Privacy Center (design items 23, 24). Self-contained: no network,
     no framework, no bundler (ADR 0006). Every figure comes from
     bedrock/settings/privacy_center.h, which counts events the engine actually
     recorded on this device. Nothing here is estimated and nothing is uploaded. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Privacy</title>
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--surface);color:var(--text);font-family:var(--font-ui);
       font-size:var(--text-base);line-height:var(--line-height);
       min-height:100vh;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
       background:radial-gradient(1000px 560px at 30% -12%,
                  rgba(255,255,255,.05), rgba(255,255,255,0) 68%)}
  main{position:relative;max-width:920px;margin:0 auto;
       padding:12vh var(--space-32) var(--space-48)}

  .eyebrow{font-family:var(--font-display);font-size:var(--text-sm);
       letter-spacing:.22em;color:var(--text-muted);margin-bottom:var(--space-16)}
  h1{font-family:var(--font-display);font-size:44px;font-weight:var(--weight-semibold);
     letter-spacing:-.02em;line-height:1.1;max-width:16ch}
  .level{display:inline-flex;align-items:center;gap:var(--space-8);
     margin-top:var(--space-24);padding:var(--space-6) var(--space-12);
     border:1px solid var(--border);border-radius:var(--radius-pill);
     color:var(--text-muted);font-size:var(--text-sm)}
  .level .dot{width:7px;height:7px;border-radius:var(--radius-pill);
     background:var(--accent)}

  /* Item 24: dashboard composition where it earns its place — four numbers,
     nothing that pretends to be an analytics product. */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-16);
        margin-top:var(--space-48)}
  .metric{background:var(--surface-glass);backdrop-filter:blur(10px);
        border:1px solid var(--border);border-radius:var(--radius-lg);
        padding:var(--space-32) var(--space-24);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
  .metric .n{font-family:var(--font-display);font-size:40px;
        font-weight:var(--weight-semibold);letter-spacing:-.02em;
        font-variant-numeric:tabular-nums}
  .metric .l{color:var(--text-muted);font-size:var(--text-sm);
        letter-spacing:.14em;text-transform:uppercase;margin-top:var(--space-8)}
  .metric.quiet .n{color:var(--text-muted)}

  .note{margin-top:var(--space-32);color:var(--text-muted);font-size:var(--text-sm);
        max-width:62ch}
  .actions{display:flex;gap:var(--space-8);margin-top:var(--space-24)}
  .actions button{background:none;border:1px solid var(--border-strong);
        color:var(--text);font:inherit;font-size:var(--text-sm);
        padding:var(--space-8) var(--space-16);border-radius:var(--radius-md);
        cursor:pointer;min-height:var(--hit-target-min);
        transition:background var(--motion-standard)}
  .actions button:hover{background:var(--surface-raised)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
  @media (max-width: 720px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <div class="eyebrow">PRIVACY</div>
  <h1>What this browser has actually done for you</h1>
  <div class="level"><span class="dot" aria-hidden="true"></span>
    <span>Protection level: <span id="level">—</span></span></div>
  <div class="grid" id="grid"></div>
  <p class="note" id="note"></p>
  <div class="actions">
    <button type="button" id="export">Export these counts</button>
    <button type="button" id="reset">Reset counters</button>
  </div>
</main>
<script src="privacy_center.js"></script>
</body>
</html>
