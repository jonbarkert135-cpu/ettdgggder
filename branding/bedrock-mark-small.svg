<?xml version="1.0" encoding="UTF-8"?>
<!-- Bedrock mark, small-size variant (16-32 px). Copyright 2026 The Bedrock Authors. MPL-2.0.
     Three bands instead of six and a thicker copper seam: below ~32 px the full
     mark's seams fall under one pixel and the strata read as grey noise. Same
     idea, fewer facts — an icon that is illegible in the tab strip is a bug. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Bedrock">
  <title>Bedrock</title>
  <defs><clipPath id="disc-sm"><circle cx="16" cy="16" r="14"/></clipPath></defs>
  <g clip-path="url(#disc-sm)">
    <rect width="32" height="32" fill="#101214"/>
    <path d="M0 0 H32 V12 L18 11 L0 13 Z" fill="#4A5054"/>
    <path d="M0 14 L18 12 L32 13 V19 L14 20 L0 18 Z" fill="#B4622A"/>
    <path d="M0 20 L14 22 L32 21 V32 H0 Z" fill="#3A4044"/>
  </g>
  <circle cx="16" cy="16" r="14" fill="none" stroke="#1B1A18" stroke-width="2"/>
</svg>
