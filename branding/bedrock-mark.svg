    <path d="M0 54 L84 62 L152 52 L256 60 L256 92 L140 86 L72 96 L0 88 Z" fill="#3A4044"/>
    <path d="M0 96 L72 104 L140 94 L256 100 L256 130 L120 124 L60 134 L0 126 Z" fill="#565C60"/>
