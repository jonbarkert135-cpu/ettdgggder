    <path d="M0 162 L64 170 L128 160 L256 166 L256 198 L112 192 L52 202 L0 194 Z" fill="#33393D"/>
    <path d="M0 202 L52 210 L112 200 L256 206 L256 256 L0 256 Z" fill="#454B4F"/>
  </g>
  <circle cx="128" cy="128" r="112" fill="none" stroke="#1B1A18" stroke-width="8"/>
